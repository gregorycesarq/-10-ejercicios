<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Grados</title>
</head>
<body>
    <h1>Conversor de Grados</h1>
    <button onclick="alert(convertirGrados(100, 'C'))">100°C a °F</button>

    <script>
        function convertirGrados(grados, tipo) {
            if (tipo === 'C') {
                return (grados * 9/5) + 32; // Celsius a Fahrenheit
            } else {
                return (grados - 32) * 5/9; // Fahrenheit a Celsius
            }
        }
    </script>
</body>
</html>
