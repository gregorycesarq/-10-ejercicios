<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Vocales</title>
</head>
<body>
    <h1>Contador de Vocales</h1>
    <input type="text" id="vocalesInput" placeholder="Escribe un texto">
    <button onclick="alert(contarVocales(document.getElementById('vocalesInput').value))">Contar vocales</button>

    <script>
        function contarVocales(texto) {
            const vocales = texto.match(/[aeiou]/gi);
            return vocales ? vocales.length : 0;
        }
    </script>
</body>
</html>
