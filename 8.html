<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversión de Cadena</title>
</head>
<body>

    <h1>Inversión de Cadena</h1>
    <input type="text" id="cadena" placeholder="Introduce una cadena">
    <button onclick="invertirCadena()">Invertir</button>
    <p id="resultado"></p>

    <script>
        function invertirCadena() {
            let cadena = document.getElementById("cadena").value;
            let cadenaInvertida = cadena.split('').reverse().join('');
            document.getElementById("resultado").innerText = "Cadena invertida: " + cadenaInvertida;
        }
    </script>

</body>
</html>
