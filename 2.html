<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Palíndromos</title>
</head>
<body>
    <h1>Verificador de Palíndromos</h1>
    <input type="text" id="palindromoInput" placeholder="Escribe una palabra">
    <button onclick="alert(esPalindromo(document.getElementById('palindromoInput').value))">Verificar</button>

    <script>
        function esPalindromo(texto) {
            const textoLimpiado = texto.toLowerCase().replace(/[^a-z0-9]/g, '');
            return textoLimpiado === textoLimpiado.split('').reverse().join('');
        }
    </script>
</body>
</html>
