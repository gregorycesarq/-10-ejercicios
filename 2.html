<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Palíndromo</title>
</head>
<body>

    <h1>Verificador de Palíndromo</h1>
    <input type="text" id="cadena" placeholder="Ingresa una cadena">
    <button onclick="verificarPalindromo()">Verificar</button>
    <p id="resultado"></p>

    <script>
        function verificarPalindromo() {
            let cadena = document.getElementById("cadena").value;
            let cadenaLimpiada = cadena.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
            let cadenaInvertida = cadenaLimpiada.split('').reverse().join('');
            if (cadenaLimpiada === cadenaInvertida) {
                document.getElementById("resultado").innerText = "Es un palíndromo";
            } else {
                document.getElementById("resultado").innerText = "No es un palíndromo";
            }
        }
    </script>

</body>
</html>
