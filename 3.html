<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Números Aleatorios</title>
</head>
<body>

    <h1>Generador de Números Aleatorios</h1>
    <label for="min">Mínimo: </label>
    <input type="number" id="min" value="1">
    <label for="max">Máximo: </label>
    <input type="number" id="max" value="100">
    <button onclick="generarNumero()">Generar Número</button>
    <p id="resultado"></p>

    <script>
        function generarNumero() {
            let min = parseInt(document.getElementById("min").value);
            let max = parseInt(document.getElementById("max").value);
            let numeroAleatorio = Math.floor(Math.random() * (max - min + 1)) + min;
            document.getElementById("resultado").innerText = "Número aleatorio: " + numeroAleatorio;
        }
    </script>

</body>
</html>
