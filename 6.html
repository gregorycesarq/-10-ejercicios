<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial de un Número</title>
</head>
<body>

    <h1>Factorial de un Número</h1>
    <input type="number" id="numero" placeholder="Introduce un número">
    <button onclick="calcularFactorial()">Calcular Factorial</button>
    <p id="resultado"></p>

    <script>
        function calcularFactorial() {
            let num = parseInt(document.getElementById("numero").value);
            let resultado = 1;
            for (let i = 1; i <= num; i++) {
                resultado *= i;
            }
            document.getElementById("resultado").innerText = "Factorial: " + resultado;
        }
    </script>

</body>
</html>
