<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suma de Elementos de un Array</title>
</head>
<body>

    <h1>Suma de Elementos de un Array</h1>
    <input type="text" id="array" placeholder="Introduce números separados por coma">
    <button onclick="sumarArray()">Sumar</button>
    <p id="resultado"></p>

    <script>
        function sumarArray() {
            let array = document.getElementById("array").value.split(',').map(Number);
            let suma = array.reduce((a, b) => a + b, 0);
            document.getElementById("resultado").innerText = "Suma: " + suma;
        }
    </script>

</body>
</html>
