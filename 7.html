<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar un Elemento en un Arreglo</title>
</head>
<body>
    <h1>Buscar un Elemento en un Arreglo</h1>
    <button onclick="alert(buscarElemento([1, 2, 3, 4, 5], 3))">Buscar 3</button>

    <script>
        function buscarElemento(arreglo, elemento) {
            return arreglo.includes(elemento);
        }
    </script>
</body>
</html>
