<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Números Primos</title>
</head>
<body>

    <h1>Buscador de Números Primos</h1>
    <input type="number" id="rangoMax" placeholder="Introduce el número máximo">
    <button onclick="buscarPrimos()">Buscar Primos</button>
    <p id="resultado"></p>

    <script>
        function buscarPrimos() {
            let rangoMax = parseInt(document.getElementById("rangoMax").value);
            let primos = [];
            for (let num = 2; num <= rangoMax; num++) {
                let esPrimo = true;
                for (let i = 2; i <= Math.sqrt(num); i++) {
                    if (num % i === 0) {
                        esPrimo = false;
                        break;
                    }
                }
                if (esPrimo) {
                    primos.push(num);
                }
            }
            document.getElementById("resultado").innerText = "Números primos: " + primos.join(", ");
        }
    </script>

</body>
</html>
