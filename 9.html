<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números de Fibonacci</title>
</head>
<body>
    <h1>Números de Fibonacci</h1>
    <button onclick="alert(fibonacci(10))">Fibonacci de 10</button>

    <script>
        function fibonacci(n) {
            const serie = [0, 1];
            for (let i = 2; i < n; i++) {
                serie[i] = serie[i - 1] + serie[i - 2];
            }
            return serie.slice(0, n);
        }
    </script>
</body>
</html>
